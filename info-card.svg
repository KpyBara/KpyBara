<svg
xmlns="http://www.w3.org/2000/svg"
width="490"
height="390"
viewBox="0 0 490 390">

<defs>

    <!-- Fundo -->
    <linearGradient
        id="panel"
        x1="0"
        y1="0"
        x2="1"
        y2="1">

        <stop
            offset="0%"
            stop-color="#0D0710"/>

        <stop
            offset="100%"
            stop-color="#050509"/>

    </linearGradient>


    <!-- Brilho Neon -->
    <filter
        id="glow"
        x="-100%"
        y="-100%"
        width="300%"
        height="300%">

        <feGaussianBlur
            stdDeviation="2"
            result="blur"/>

        <feMerge>

            <feMergeNode
                in="blur"/>

            <feMergeNode
                in="SourceGraphic"/>

        </feMerge>

    </filter>


    <!-- Scanlines -->
    <pattern
        id="scanlines"
        width="4"
        height="4"
        patternUnits="userSpaceOnUse">

        <line
            x1="0"
            y1="0"
            x2="4"
            y2="0"
            stroke="#FF0055"
            stroke-opacity="0.035"
            stroke-width="1"/>

    </pattern>


    <!-- Animação -->
    <style>

        .line {
            opacity: 0;
            animation:
                bootLine
                0.4s
                ease-out
                forwards;
        }

        @keyframes bootLine {

            0% {
                opacity: 0;
                transform:
                    translateX(-12px);
            }

            70% {
                opacity: 1;
                transform:
                    translateX(2px);
            }

            100% {
                opacity: 1;
                transform:
                    translateX(0);
            }

        }

    </style>

</defs>


<!-- ===================================================== -->
<!-- PAINEL -->
<!-- ===================================================== -->

<rect
    x="1"
    y="1"
    width="488"
    height="388"
    rx="10"
    fill="url(#panel)"
    stroke="#FF0055"
    stroke-opacity="0.45"
    stroke-width="1"/>


<rect
    width="100%"
    height="100%"
    rx="10"
    fill="url(#scanlines)"/>


<!-- ===================================================== -->
<!-- CABEÇALHO -->
<!-- ===================================================== -->

<text
    x="25"
    y="32"
    fill="#FF0055"
    font-family="monospace"
    font-size="14"
    font-weight="bold">

    KPYBARA@AFTERLIFE

</text>


<text
    x="465"
    y="32"
    text-anchor="end"
    fill="#777777"
    font-family="monospace"
    font-size="9">

    NET://PROFILE

</text>


<line
    x1="25"
    y1="45"
    x2="465"
    y2="45"
    stroke="#FF0055"
    stroke-opacity="0.3"/>


<!-- ===================================================== -->
<!-- IDENTIDADE -->
<!-- ===================================================== -->

