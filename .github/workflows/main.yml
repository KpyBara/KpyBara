name: generate animation

on:
  schedule:
    - cron: "0 0 * * *"

  # Permite rodar manualmente a qualquer momento
  workflow_dispatch:

  # Roda a cada push na branch principal (ajuste para 'main' se a sua branch principal for 'main')
  push:
    branches:
      - master
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Gera o jogo da cobra com a paleta Cyberpunk Mercenários
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%2300F0FF&color_dots=%23ebedf0,%239be9a8,%2340c463,%2330a14e,%23216e39
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23FFE600&color_dots=%2312131C,%231F2438,%23005F73,%2300F0FF,%23FF0055

      # Envia os arquivos gerados para a branch 'output'
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
